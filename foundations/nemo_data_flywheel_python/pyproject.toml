[project]
name = "cookbook-nemo-data-flywheel"
version = "0.1"
description = "Durable NVIDIA NeMo microservices data-flywheel pipeline: fine-tune, evaluate, quality-gate, deploy"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "temporalio>=1.15.0,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.26.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
